- name: install and start nginx
  hosts: frontend #frontend private ip need to give inventory file frontend host
  tasks:
  - name: install nginx
    package:
      name: nginx
      state: present
  
  - name: start nginx
    service:
      name: nginx
      state: started
      enabled: yes

